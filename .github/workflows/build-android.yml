name: build-and-release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r26d
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build mediapipe_face_mesh (${{ matrix.abi }})
        run: |
          cmake -S android/cmake -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.abi }} --config Release

      - name: Stage artifacts
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libmediapipe_face_mesh.so dist/${{ matrix.abi }}/
          cp android/src/main/jniLibs/${{ matrix.abi }}/libmpfm_tensorflowlite_c.so dist/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: mpfm-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zip
        run: |
          cd artifacts
          zip -r ../mediapipe-facemesh-android.zip .

      - name: Build release identity (ISO 8601 UTC)
        id: rel
        shell: bash
        run: |
          TAG="v$(date -u +%Y%m%dT%H%M%SZ)"
          NAME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Release (softprops/action-gh-release@v1, ISO 8601)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: mediapipe-facemesh-android.zip
          generate_release_notes: true
          prerelease: false
          body: |
            Forked arrangement of cornpip/mediapipe_face_mesh for Android arm64-v8a + x86_64.
            Assembled by Inkling 2 Small Free to produce Android native libraries via GitHub Actions.
            Not an authoritative upstream: for the Flutter plugin, use cornpip's repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
