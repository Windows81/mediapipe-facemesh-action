name: Build
on:
  push:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Generate Release Data
        shell: bash
        run: |
          export LC_ALL=en_US.utf8
          GIT_COMMIT_ID=$(echo "${{ github.sha }}" | cut -c 1-7)
          if [ -n "${{ github.event.head_commit.timestamp }}" ]; then
            RAW="${{ github.event.head_commit.timestamp }}"
          else
            RAW="${{ github.event.repository.updated_at }}"
          fi
          UPDATE_TIME=$(echo "$RAW" | sed 's/[:-]//g')
          echo "tag_name=v${UPDATE_TIME}" >> $GITHUB_ENV
          echo "release_name=${UPDATE_TIME} (${GIT_COMMIT_ID})" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Install NDK r26d
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build mediapipe_face_mesh (${{ matrix.abi }})
        run: |
          cmake -S android/cmake -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.abi }} --config Release

      - name: Stage artifacts
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libmediapipe_face_mesh.so dist/${{ matrix.abi }}/
          cp build/${{ matrix.abi }}/libeygaze_mesh_jni.so dist/${{ matrix.abi }}/
          cp build/${{ matrix.abi }}/libeygaze_mesh_jni15.so dist/${{ matrix.abi }}/
          cp build/${{ matrix.abi }}/libeygaze_mesh_jni15_mir.so dist/${{ matrix.abi }}/
          cp android/src/main/jniLibs/${{ matrix.abi }}/libmpfm_tensorflowlite_c.so dist/${{ matrix.abi }}/
          mkdir -p dist/${{ matrix.abi }}/models
          cp assets/models/face_landmark_with_attention.tflite dist/${{ matrix.abi }}/models/
          cp assets/models/face_detection_full_range.tflite dist/${{ matrix.abi }}/models/

      - uses: actions/upload-artifact@v4
        with:
          name: mpfm-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zip
        shell: bash
        run: |
          cd artifacts
          zip -r ../mediapipe-facemesh-android.zip .

      - name: Generate Release Data
        shell: bash
        run: |
          export LC_ALL=en_US.utf8
          GIT_COMMIT_ID=$(echo "${{ github.sha }}" | cut -c 1-7)
          if [ -n "${{ github.event.head_commit.timestamp }}" ]; then
            RAW="${{ github.event.head_commit.timestamp }}"
          else
            RAW="${{ github.event.repository.updated_at }}"
          fi
          UPDATE_TIME=$(echo "$RAW" | sed 's/[:-]//g')
          echo "tag_name=v${UPDATE_TIME}" >> $GITHUB_ENV
          echo "release_name=${UPDATE_TIME} (${GIT_COMMIT_ID})" >> $GITHUB_ENV

      - name: Release with Notes
        uses: softprops/action-gh-release@v2
        with:
          files: mediapipe-facemesh-android.zip
          name: ${{ env.release_name }}
          tag_name: ${{ env.tag_name }}
          generate_release_notes: true
          overwrite_files: false
          body: |
            Forked arrangement of cornpip/mediapipe_face_mesh for Android arm64-v8a + x86_64.
            Assembled by Inkling 2 Small Free (OpenCode agent, model opencode/inkling-2-small-free).
            Agentic engineering — AI-authored under human direction.
            Not an authoritative upstream: for the Flutter plugin, use cornpip's repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
